<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTrack - Consultor IA</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/consultor.css">
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="noticia.html">Notícias</a></li>
                <li><a href="questionario.html">Perfil Investidor</a></li>
                <li><a href="consultor.html" class="nav-ativo">Consultor IA</a></li>
            </ul>
            <div id="nav-usuario">
                <a href="login.html">Entrar</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="consultor">

            <div class="consultor-header">
                <h2>🤖 Consultor IA</h2>
                <p>Assistente especializado em economia e finanças da Ontrack · </p>
                <button id="btn-limpar" type="button" onclick="limparConversa()">🗑️ Limpar conversa</button>
            </div>

            <!-- mensagens da conversa -->
            <div class="chat-container" id="chat-container">

                <div class="mensagem mensagem-ia">
                    <div class="mensagem-avatar">🤖</div>
                    <div class="mensagem-conteudo">
                        <p>Olá! Sou o consultor financeiro do OnTrack. Como posso ajudar você hoje?</p>
                        <span class="mensagem-hora" id="hora-inicial"></span>
                    </div>
                </div>

            </div>

            <!-- área de entrada -->
            <!-- cotas das APIs: quanto ainda resta em cada uma hoje (GET /api/status-ias) -->
            <div class="composer-cotas" id="consultor-cotas">
                <span class="cota-vazia">verificando as cotas das APIs...</span>
            </div>

            <div class="chat-input-area">
                <textarea
                    id="input-mensagem"
                    placeholder="Digite sua pergunta sobre finanças, investimentos, economia..."
                    rows="1"
                ></textarea>
                <button id="btn-enviar" type="button" onclick="enviarMensagem()">
                    <span id="btn-enviar-texto">Enviar</span>
                </button>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; Ontrack.</p>
    </footer>

    <script type="module">
        import { verificarLogin, buscarDadosUsuario, normalizarMemoria, logout,
            salvarConversa, apagarConversa, observarConversas, LIMITE_CONVERSAS } from '../firebase.js';

        // ============================================================
        // CONFIGURAÇÃO DO BACK-END
        // A API fica na mesma origem em produção (o site e a função Python são
        // servidos pelo mesmo domínio), então a URL é relativa e não precisa de
        // configuração por ambiente. O backend local da porta 5000 só é usado
        // quando a página é servida por outro servidor.
        // ============================================================
         const API_BASE =
            ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
                location.port !== '5000') ||
            location.protocol === 'file:'
                ? 'http://localhost:5000'
                : '';
        const BACKEND_URL = `${API_BASE}/api/chat`;

        // Referência ao usuário logado (Firebase) para enviar uid ao back-end
        let usuarioLogado = null;
        let usuarioUid = null;

        // ============================================================
        // HISTÓRICO COMPARTILHADO COM A BARRA LATERAL DO INDEX
        //
        // MESMAS chaves e MESMA coleção que o index.html usa: o espelho local
        // ontrack_conversas_<uid> (visitante: ontrack_conversas_visitante) e a
        // subcoleção usuarios/{uid}/conversas no Firestore. É o que faz a conversa
        // que começa aqui aparecer na barra lateral do início — e vice-versa —
        // em vez de existirem dois históricos diferentes.
        // ============================================================
        let conversas = [];          // a mesma lista que a barra lateral do index mostra
        let mensagens = [];          // mensagens da conversa aberta nesta página
        let conversaAtual = null;    // id da conversa aberta aqui (null = nova)
        let pararDeObservar = null;

        const chaveLocal = () =>
            usuarioUid ? `ontrack_conversas_${usuarioUid}` : 'ontrack_conversas_visitante';

        function lerEspelhoLocal() {
            try {
                const lista = JSON.parse(localStorage.getItem(chaveLocal()));
                return Array.isArray(lista) ? lista : [];
            } catch {
                return [];
            }
        }

        function gerarTitulo(texto) {
            const t = String(texto).replace(/\s+/g, ' ').trim();
            return t.length > 38 ? t.slice(0, 38) + '…' : (t || 'Nova conversa');
        }

        // ao abrir a página, volta para a conversa mais recente — a mesma que o
        // index abriria pela barra lateral
        function restaurarDaUltimaMensagem() {
            const ultima = [...conversas]
                .sort((a, b) => Number(b.atualizadaEm || 0) - Number(a.atualizadaEm || 0))[0];
            if (!ultima?.mensagens?.length) return;
            mensagens = ultima.mensagens;
            conversaAtual = ultima.id;
            mensagens.forEach((m) => {
                if (m.tipo === 'imagem' && m.url) {
                    adicionarMensagemImagem(m.url, m.texto || '', m.hora, m.custo || null);
                    return;
                }
                adicionarMensagem(m.texto || '', m.papel === 'usuario' ? 'usuario' : 'ia', m.hora, m.custo || null);
            });
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function persistirConversa() {
            if (!mensagens.length) return;
            const titulo = gerarTitulo(mensagens[0].texto);
            const agora = Date.now();
            let conversa = conversaAtual
                ? conversas.find(c => String(c.id) === String(conversaAtual))
                : null;

            if (conversa) {
                conversa.mensagens = mensagens;
                conversa.atualizadaEm = agora;
            } else {
                conversaAtual = 'c' + agora;
                conversa = { id: conversaAtual, titulo, mensagens, atualizadaEm: agora };
                conversas.unshift(conversa);
                if (conversas.length > LIMITE_CONVERSAS) conversas.length = LIMITE_CONVERSAS;
            }

            // espelho local na hora: recarregar a página durante a resposta não perde nada
            try {
                localStorage.setItem(chaveLocal(), JSON.stringify(conversas.slice(0, LIMITE_CONVERSAS)));
            } catch { /* quota cheia — o Firestore continua sendo a fonte da verdade */ }

            // e o servidor recebe em seguida: é o que faz a conversa aparecer na
            // barra lateral do index, neste e em outros aparelhos
            if (usuarioUid) {
                salvarConversa(usuarioUid, conversa).catch((erro) =>
                    console.warn('Histórico no Firestore indisponível:', erro));
            }
        }

        // memória do assistente: vem do Firestore e vai em cada mensagem, porque o
        // backend em serverless não guarda estado
        let memoriaDoUsuario = { fatos: [] };

        // navbar dinâmica + histórico sincronizado
        verificarLogin(async (usuario) => {
            usuarioLogado = usuario;
            usuarioUid = usuario?.uid || null;

            const navUsuario = document.getElementById('nav-usuario');
            if (usuario) {
                const dados = await buscarDadosUsuario(usuario.uid);
                memoriaDoUsuario = normalizarMemoria(dados?.memoria);
                const nome = dados?.nome || usuario.displayName || 'Usuário';
                navUsuario.innerHTML = `
                    <span class="nav-saudacao">Olá, ${nome}</span>
                    <a href="perfil.html" class="btn-perfil">Meu perfil</a>
                    <button id="btn-sair" class="btn-sair">Sair</button>
                `;
                document.getElementById('btn-sair').addEventListener('click', async () => {
                    await logout();
                    window.location.href = '../index.html';
                });
            }

            conectarHistorico();
        });

        // liga o histórico ao Firestore quando há conta; sem conta, só o espelho local
        function conectarHistorico() {
            if (pararDeObservar) { pararDeObservar(); pararDeObservar = null; }
            conversas = lerEspelhoLocal();
            restaurarDaUltimaMensagem();
            if (!usuarioUid) return;

            // MESMO onSnapshot do index: a lista do servidor passa a ser a única
            // verdade, e o que muda num aparelho chega aqui em tempo real
            pararDeObservar = observarConversas(usuarioUid, (lista) => {
                const eraAAberta = conversaAtual
                    && conversas.some(c => String(c.id) === String(conversaAtual))
                    && !lista.some(c => String(c.id) === String(conversaAtual));
                conversas = lista;
                if (eraAAberta) {
                    // excluída em outro aparelho: volta para a tela inicial daqui também
                    limparConversa();
                    conversaAtual = null;
                    mensagens = [];
                    return;
                }
                if (!conversaAtual && !mensagens.length) {
                    // primeira lista do servidor (ex.: visitou a página logado em um
                    // navegador novo): abre a conversa mais recente, como no index
                    restaurarDaUltimaMensagem();
                    return;
                }
                const atual = lista.find(c => String(c.id) === String(conversaAtual));
                if (atual && atual.mensagens?.length && atual.mensagens.length > mensagens.length) {
                    // respondeu em outro aparelho: as mensagens chegam aqui também
                    mensagens = atual.mensagens;
                }
            }, (erro) => console.warn('Histórico no Firestore indisponível:', erro));
        }

        // hora inicial
        document.getElementById('hora-inicial').textContent = horaAtual();

        // enviar a msg
        // a flag evita envios simultâneos: desabilitar o botão não bloqueia o Enter
        let enviandoConsultor = false;

        window.enviarMensagem = async () => {
            const input = document.getElementById('input-mensagem');
            const texto = input.value.trim();

            if (!texto || enviandoConsultor) return;
            enviandoConsultor = true;

            adicionarMensagem(texto, 'usuario');
            mensagens.push({ papel: 'usuario', texto, hora: horaAtual() });
            persistirConversa();
            input.value = '';
            input.style.height = 'auto';

            const indicador = mostrarIndicador();

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            document.getElementById('btn-enviar-texto').textContent = 'Analisando...';

            // teto de espera: o backend pode levar minutos; sem isso a tela trava
            const controlador = new AbortController();
            const temporizador = setTimeout(() => controlador.abort(), 180000);

            try {
                const resposta = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensagem: texto,
                        uid: usuarioLogado?.uid ?? null,
                        memoria: memoriaDoUsuario
                    }),
                    signal: controlador.signal
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.erro || dados.message || 'Erro no servidor');
                }

                indicador.remove();
                renderizarRespostaIA(dados);

            } catch (erro) {
                indicador.remove();
                const expirou = erro && erro.name === 'AbortError';
                adicionarMensagem(
                    expirou
                        ? 'A resposta demorou mais que o normal e a espera foi interrompida. Tente novamente.'
                        : 'Desculpe, ocorreu um erro ao processar sua pergunta. Tente novamente.',
                    'ia'
                );
                console.error('Erro:', erro);
            } finally {
                clearTimeout(temporizador);
                btn.disabled = false;
                document.getElementById('btn-enviar-texto').textContent = 'Enviar';
                enviandoConsultor = false;
                atualizarCotas();  // a resposta consumida move os contadores do painel
            }
        };

        // interpreta o JSON retornado pelo back-end (tipo: "texto" ou "imagem")
        function renderizarRespostaIA(dados) {
            const custo = (dados && dados.custo) || null;

            if (dados.tipo === 'texto' && dados.resposta) {
                adicionarMensagem(dados.resposta, 'ia', null, custo);
                mensagens.push({ papel: 'ia', texto: dados.resposta, hora: horaAtual(), custo });
                persistirConversa();
                return;
            }

            if (dados.tipo === 'imagem' && dados.url) {
                const urlSegura = sanitizarUrlImagem(dados.url);
                if (!urlSegura) {
                    adicionarMensagem('Não foi possível exibir o gráfico retornado pelo servidor.', 'ia');
                    mensagens.push({ papel: 'ia', texto: 'Não foi possível exibir o gráfico retornado pelo servidor.', hora: horaAtual(), custo });
                    persistirConversa();
                    return;
                }
                adicionarMensagemImagem(urlSegura, dados.texto, null, custo);
                mensagens.push({ papel: 'ia', tipo: 'imagem', url: urlSegura, texto: dados.texto || '', hora: horaAtual(), custo });
                persistirConversa();
                return;
            }

            adicionarMensagem('Recebi uma resposta inesperada do servidor. Tente novamente.', 'ia');
            mensagens.push({ papel: 'ia', texto: 'Recebi uma resposta inesperada do servidor. Tente novamente.', hora: horaAtual(), custo });
            persistirConversa();
        }

        // ---------- medidor de consumo (o backend devolve dados.custo) ----------
        function rotuloCusto(custo) {
            const ia = Number(custo?.ia) || 0;
            const fontes = Number(custo?.fontes) || 0;
            const partes = [];
            if (ia > 0) partes.push(ia === 1 ? '1 chamada de IA' : `${ia} chamadas de IA`);
            if (fontes > 0) partes.push(fontes === 1 ? '1 consulta de mercado' : `${fontes} consultas de mercado`);
            return partes.join(' · ');
        }

        function elementoCusto(custo) {
            const rotulo = rotuloCusto(custo);
            if (!rotulo) return null;
            const span = document.createElement('span');
            span.className = 'mensagem-custo';
            span.textContent = rotulo;
            span.title = 'Requisições externas consumidas por esta resposta';
            return span;
        }

        // adicionar msg de texto
        function adicionarMensagem(texto, tipo, hora = null, custo = null) {
            const container = document.getElementById('chat-container');

            const div = document.createElement('div');
            div.classList.add('mensagem', `mensagem-${tipo}`);

            const avatar = tipo === 'ia' ? '🤖' : '👤';

            const conteudo = document.createElement('div');
            conteudo.classList.add('mensagem-conteudo');
            conteudo.innerHTML = `<p>${formatarTexto(texto)}</p>`;

            const spanHora = document.createElement('span');
            spanHora.classList.add('mensagem-hora');
            spanHora.textContent = hora || horaAtual();
            conteudo.appendChild(spanHora);

            const spanCusto = tipo === 'ia' ? elementoCusto(custo) : null;
            if (spanCusto) conteudo.appendChild(spanCusto);

            div.innerHTML = `<div class="mensagem-avatar">${avatar}</div>`;
            div.appendChild(conteudo);

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // adicionar msg com imagem/gráfico retornado pelo back-end (appendChild — não altera o histórico)
        function adicionarMensagemImagem(url, texto = '', hora = null, custo = null) {
            const urlSegura = sanitizarUrlImagem(url);
            if (!urlSegura) {
                adicionarMensagem('Não foi possível exibir o gráfico retornado pelo servidor.', 'ia');
                return;
            }

            const container = document.getElementById('chat-container');

            const div = document.createElement('div');
            div.classList.add('mensagem', 'mensagem-ia');

            const avatar = document.createElement('div');
            avatar.classList.add('mensagem-avatar');
            avatar.textContent = '🤖';

            const conteudo = document.createElement('div');
            conteudo.classList.add('mensagem-conteudo');

            if (texto) {
                const paragrafo = document.createElement('p');
                paragrafo.insertAdjacentHTML('afterbegin', formatarTexto(texto));
                conteudo.appendChild(paragrafo);
            }

            const img = document.createElement('img');
            img.src = urlSegura;
            img.alt = 'Gráfico gerado pelo consultor';
            img.style.maxWidth = '100%';
            img.style.borderRadius = '8px';
            conteudo.appendChild(img);

            const spanHora = document.createElement('span');
            spanHora.classList.add('mensagem-hora');
            spanHora.textContent = hora || horaAtual();
            conteudo.appendChild(spanHora);

            const spanCusto = elementoCusto(custo);
            if (spanCusto) conteudo.appendChild(spanCusto);

            div.appendChild(avatar);
            div.appendChild(conteudo);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // barra de digitação
        function mostrarIndicador() {
            const container = document.getElementById('chat-container');

            const div = document.createElement('div');
            div.classList.add('mensagem', 'mensagem-ia', 'mensagem-digitando');
            div.innerHTML = `
                <div class="mensagem-avatar">🤖</div>
                <div class="mensagem-conteudo">
                    <div class="digitando">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        // limpar a conversa: agora é a MESMA exclusão da barra lateral do index —
        // sai do espelho local e, com conta, do Firestore (desaparece em todos os
        // aparelhos, e o index recebe a remoção em tempo real pelo próprio onSnapshot)
        window.limparConversa = async () => {
            const id = conversaAtual;
            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="mensagem mensagem-ia">
                    <div class="mensagem-avatar">🤖</div>
                    <div class="mensagem-conteudo">
                        <p>Olá! Sou o consultor financeiro do OnTrack. Como posso ajudar você hoje?</p>
                        <span class="mensagem-hora">${horaAtual()}</span>
                    </div>
                </div>
            `;
            if (!id) return;
            conversas = conversas.filter(c => String(c.id) !== String(id));
            conversaAtual = null;
            mensagens = [];
            try {
                localStorage.setItem(chaveLocal(), JSON.stringify(conversas.slice(0, LIMITE_CONVERSAS)));
            } catch { /* sem espelho local */ }
            if (usuarioUid) {
                try {
                    await apagarConversa(usuarioUid, id);
                } catch (erro) {
                    console.warn('Não consegui apagar no servidor:', erro);
                }
            }
        };

        // enviar msg com enter
        document.getElementById('input-mensagem').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        });

        // rede de segurança: nenhum envio pode submeter/recarregar a página
        document.addEventListener('submit', (e) => e.preventDefault(), true);

        // redimensiona o textarea automaticamente
        document.getElementById('input-mensagem').addEventListener('input', (e) => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });

        // funções extras
        function horaAtual() {
            return new Date().toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(texto) {
            return String(texto)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatarTexto(texto) {
            return escapeHtml(texto)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function sanitizarUrlImagem(url) {
            try {
                const parsed = new URL(url, window.location.origin);
                if (!['http:', 'https:'].includes(parsed.protocol)) return null;
                return parsed.href;
            } catch {
                return null;
            }
        }

        // exibição do custo junto da hora
        const estilo = document.createElement('style');
        estilo.textContent = '.mensagem-custo{display:block;margin-top:2px;font-size:10.5px;opacity:.45;}';
        document.head.appendChild(estilo);

    </script>

</body>

</html>
